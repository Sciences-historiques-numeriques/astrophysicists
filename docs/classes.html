<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classes – SPARQL browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="chrome"></div>
  <div id="out"></div>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
start(async () => {
  const out = $('out');
  out.innerHTML = '<p class="sub">Loading classes…</p>';
  try {
    const rows = await select(
      `SELECT ?class ?g (COUNT(?s) AS ?n) WHERE { ` +
      `${inGraphs(currentSel(), '?s a ?class . FILTER(isIRI(?class))')} } ` +
      `GROUP BY ?class ?g ORDER BY ?class ?g LIMIT 5000`);
    const labels = await fetchLabels(rows.map(r => r.class.value));
    out.innerHTML = `
      <section>
        <h2>Classes (${rows.length}${rows.length >= 5000 ? '+' : ''} class–graph groups)</h2>
        ${filterInput()}
        <table>
          <thead><tr><th class="sortable">Class</th><th class="sortable">Label</th><th>Named graph</th><th class="num sortable" data-type="num">Instances</th></tr></thead>
          <tbody>${rows.map(r => `
            <tr>
              <td data-v="${esc(r.class.value.toLowerCase())}">${iriLink(r.class.value, r.class.value, 'class.html')}</td>
              <td data-v="${esc((labels.get(r.class.value) || '').toLowerCase())}">${esc(labels.get(r.class.value) || '')}</td>
              <td class="gname">${esc(r.g.value)}</td>
              <td class="num" data-v="${r.n.value}">${Number(r.n.value).toLocaleString()}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </section>`;
  } catch (e) {
    out.innerHTML = `<p class="err">Query failed: ${esc(e.message)}. Check the endpoint URL and its CORS headers.</p>`;
  }
});
</script>
</body>
</html>
