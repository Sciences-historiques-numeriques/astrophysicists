<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity – SPARQL browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="chrome"></div>
  <div id="out"></div>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const LIMIT = 300;

// Merge identical triples found in several graphs into one row with a graph list
function merge(rows, keys) {
  const m = new Map();
  for (const r of rows) {
    const k = keys.map(x => r[x].type + '|' + r[x].value + '|' +
                            (r[x]['xml:lang'] || '') + '|' + (r[x].datatype || '')).join('||');
    if (!m.has(k)) m.set(k, { ...r, graphs: [] });
    const gs = m.get(k).graphs;
    if (r.g && !gs.includes(r.g.value)) gs.push(r.g.value);
  }
  return [...m.values()];
}
function graphTag(r) {
  return r.graphs.length
    ? `<br/><span class="graph">${r.graphs.map(esc).join(', ')}</span>` : '';
}
// Link with optional rdfs:label: label as link text, IRI (short or full) in small grey text below
function labeled(iri, labels, file = 'entity.html', full = false) {
  const l = labels.get(iri);
  if (!l) return iriLink(iri, full ? iri : undefined, file);
  return `${iriLink(iri, l, file)}<br/><span class="iri">${esc(full ? iri : short(iri))}</span>`;
}
// asClass: object of rdf:type links to the class page
function renderTerm(t, asClass, labels) {
  if (t.type === 'uri') return labeled(t.value, labels, asClass ? 'class.html' : 'entity.html', true);
  const lang = t['xml:lang'] ? ` <span class="lang">@${esc(t['xml:lang'])}</span>` : '';
  return `<span class="lit">${esc(t.value)}</span>${lang}`;
}
function box(title, rows, truncated, cols) {
  const body = rows.length
    ? `<table class="kv">${rows.map(cols).join('')}</table>`
    : '<p class="sub">No triples.</p>';
  return `<section><h2>${title} (${rows.length}${truncated ? '+' : ''})</h2>${rows.length ? filterInput() : ''}${body}</section>`;
}

start(async () => {
  const out = $('out');
  const iri = $('iri').value.trim();
  if (!iri) { out.innerHTML = '<p class="sub">Enter an entity IRI above, or browse the class list.</p>'; return; }
  const sel = currentSel();
  out.innerHTML = '<p class="sub">Loading…</p>';
  try {
    const [outgoing, incoming] = await Promise.all([
      select(`SELECT DISTINCT ?p ?o ?g WHERE { ${inGraphs(sel, `<${iri}> ?p ?o`)} } LIMIT ${LIMIT}`),
      select(`SELECT DISTINCT ?s ?p ?g WHERE { ${inGraphs(sel, `?s ?p <${iri}>`)} } LIMIT ${LIMIT}`)
    ]);
    const outRows = merge(outgoing, ['p', 'o']);
    const inRows = merge(incoming, ['s', 'p']);
    // Optional labels for the entity, all predicates, URI objects and subjects
    const labels = await fetchLabels([iri,
      ...outRows.flatMap(r => [r.p.value, r.o.type === 'uri' ? r.o.value : null]),
      ...inRows.flatMap(r => [r.s.value, r.p.value])]);
    const label = labels.get(iri);
    out.innerHTML = `
      <h1>${esc(label || iri)}</h1>
      <div class="sub">${label ? esc(iri) + ' · ' : ''}${esc(endpoint())}</div>
      <div class="grid">
        ${box('Outgoing', outRows, outgoing.length >= LIMIT, r =>
          `<tr><td>${labeled(r.p.value, labels)}</td><td>${renderTerm(r.o, r.p.value === RDF_TYPE, labels)}${graphTag(r)}</td></tr>`)}
        ${box('Incoming', inRows, incoming.length >= LIMIT, r =>
          `<tr><td>${labeled(r.s.value, labels, 'entity.html', true)}${graphTag(r)}</td><td>${labeled(r.p.value, labels)}</td></tr>`)}
      </div>`;
  } catch (e) {
    out.innerHTML = `<p class="err">Query failed: ${esc(e.message)}. Check the endpoint URL and its CORS headers.</p>`;
  }
}, { iriField: true });
</script>
</body>
</html>
