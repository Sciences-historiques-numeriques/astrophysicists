<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARQL entity browser</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1d1f21; --muted: #6b7075; --line: #d9d9d4;
    --card: #fff; --accent: #1f5f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181a; --fg: #e8e8e6; --muted: #9aa0a6; --line: #34383c;
            --card: #1e2124; --accent: #7fb4dc; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; font: 15px/1.5 system-ui, sans-serif;
         background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; }
  form { display: grid; gap: .5rem; margin-bottom: 1rem; }
  input[type=text], input:not([type]) { width: 100%; padding: .5rem; font: inherit; color: inherit;
          background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
  a { color: var(--accent); text-decoration: none; word-break: break-all; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.2rem; margin: 0 0 .25rem; word-break: break-all; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section, details { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
            padding: .75rem 1rem; min-width: 0; }
  details { margin-bottom: 1rem; padding: .5rem 1rem; }
  summary { cursor: pointer; font-weight: 600; }
  .tools { margin: .5rem 0; display: flex; gap: .5rem; }
  .tools button { font: inherit; font-size: .85rem; }
  #graphs-list { max-height: 14rem; overflow: auto; border-top: 1px solid var(--line); padding-top: .4rem; }
  #graphs-list label { display: flex; gap: .5rem; align-items: baseline; padding: .15rem 0;
                       font-size: .85rem; word-break: break-all; cursor: pointer; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .3rem .4rem .3rem 0; border-top: 1px solid var(--line);
       vertical-align: top; font-size: .9rem; }
  td:first-child { width: 40%; color: var(--muted); }
  .lit { white-space: pre-wrap; word-break: break-word; }
  .lang { color: var(--muted); font-size: .75rem; }
  .graph { font-size: .7rem; opacity: .45; word-break: break-all; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <form id="cfg">
    <input id="endpoint" placeholder="SPARQL endpoint URL (must allow CORS)"
           value="https://dbpedia.org/sparql">
    <input id="iri" placeholder="Entity IRI"
           value="http://dbpedia.org/resource/Geneva">
    <button>Load</button>
  </form>

  <details id="graphs-box">
    <summary id="graphs-summary">Graphs</summary>
    <div class="tools">
      <button type="button" id="g-all">Select all</button>
      <button type="button" id="g-none">Select none</button>
    </div>
    <div id="graphs-list"></div>
  </details>

  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const LIMIT = 300;

let graphList = [];          // all graph IRIs of the current endpoint
let graphEndpoint = null;    // endpoint the list belongs to
let hashSel = null;          // null = all graphs, [] = none, [..] = subset

/* ---------- hash state: #endpoint=...&iri=...&g=<graph>&g=<graph> ---------- */
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('endpoint')) $('endpoint').value = p.get('endpoint');
  if (p.get('iri')) $('iri').value = p.get('iri');
  const g = p.getAll('g');
  if (!g.length) hashSel = null;                       // no param: all graphs
  else if (g.length === 1 && g[0] === '') hashSel = []; // g= : none selected
  else hashSel = g;
}

function checkedGraphs() {
  return [...document.querySelectorAll('#graphs-list input:checked')].map(i => i.value);
}

// Selection to carry over: null if all selected (or no list available)
function currentSel() {
  if (!graphList.length) return null;
  const c = checkedGraphs();
  return c.length === graphList.length ? null : c;
}

function linkTo(iri) {
  const p = new URLSearchParams({ endpoint: $('endpoint').value, iri });
  const sel = currentSel();
  if (sel) { if (sel.length) sel.forEach(g => p.append('g', g)); else p.append('g', ''); }
  return '#' + p.toString();
}

/* ---------- SPARQL ---------- */
async function select(endpoint, query) {
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded',
               'Accept': 'application/sparql-results+json' },
    body: new URLSearchParams({ query })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return (await res.json()).results.bindings;
}

// Wrap a triple pattern so it only matches the selected graphs
function inGraphs(sel, body) {
  const values = sel ? `VALUES ?g { ${sel.map(g => `<${g}>`).join(' ')} }` : '';
  return `${values} GRAPH ?g { ${body} }`;
}

/* ---------- graph list ---------- */
async function loadGraphs(endpoint) {
  if (graphEndpoint === endpoint) return;
  graphEndpoint = endpoint;
  graphList = [];
  $('graphs-list').innerHTML = '<span class="sub">Loading graphs…</span>';
  try {
    const rows = await select(endpoint,
      'SELECT DISTINCT ?g WHERE { GRAPH ?g { ?s ?p ?o } } ORDER BY ?g LIMIT 500');
    graphList = rows.map(r => r.g.value);
  } catch (e) {
    $('graphs-list').innerHTML =
      `<span class="err">Could not list graphs (${esc(e.message)}). Querying without graph filter.</span>`;
    return;
  }
  $('graphs-list').innerHTML = graphList.length
    ? graphList.map(g =>
        `<label><input type="checkbox" value="${esc(g)}"> <span>${esc(g)}</span></label>`).join('')
    : '<span class="sub">No named graphs found.</span>';
}

function syncCheckboxes() {
  document.querySelectorAll('#graphs-list input').forEach(i => {
    i.checked = hashSel === null || hashSel.includes(i.value);
  });
  const n = checkedGraphs().length;
  $('graphs-summary').textContent = graphList.length
    ? `Graphs (${n} of ${graphList.length} selected)` : 'Graphs';
}

function selectionChanged() {
  location.hash = linkTo($('iri').value.trim()).slice(1);
}

/* ---------- rendering ---------- */
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function short(iri) {
  const m = iri.match(/[#\/]([^#\/]+)\/?$/);
  return m ? m[1] : iri;
}
function iriLink(iri, label) {
  return `<a href="${esc(linkTo(iri))}" title="${esc(iri)}">${esc(label || short(iri))}</a>`;
}
function renderTerm(t) {
  if (t.type === 'uri') return iriLink(t.value, t.value);
  const lang = t['xml:lang'] ? ` <span class="lang">@${esc(t['xml:lang'])}</span>` : '';
  return `<span class="lit">${esc(t.value)}</span>${lang}`;
}
// Merge identical triples found in several graphs into one row with a graph list
function merge(rows, keys) {
  const m = new Map();
  for (const r of rows) {
    const k = keys.map(x => r[x].type + '|' + r[x].value + '|' +
                            (r[x]['xml:lang'] || '') + '|' + (r[x].datatype || '')).join('||');
    if (!m.has(k)) m.set(k, { ...r, graphs: [] });
    const gs = m.get(k).graphs;
    if (r.g && !gs.includes(r.g.value)) gs.push(r.g.value);
  }
  return [...m.values()];
}
function graphTag(r) {
  return r.graphs.length
    ? `<br/><span class="graph">${r.graphs.map(esc).join(', ')}</span>` : '';
}
function box(title, rows, truncated, cols) {
  const body = rows.length
    ? `<table>${rows.map(cols).join('')}</table>`
    : '<p class="sub">No triples.</p>';
  return `<section><h2>${title} (${rows.length}${truncated ? '+' : ''})</h2>${body}</section>`;
}

async function load() {
  const endpoint = $('endpoint').value.trim();
  const iri = $('iri').value.trim();
  const out = $('out');
  if (!endpoint || !iri) return;

  await loadGraphs(endpoint);
  syncCheckboxes();

  const sel = currentSel();
  if (sel && !sel.length) {
    out.innerHTML = '<p class="sub">No graph selected. Tick at least one graph above.</p>';
    return;
  }

  out.innerHTML = '<p class="sub">Loading…</p>';
  try {
    const [outgoing, incoming] = await Promise.all([
      select(endpoint, `SELECT DISTINCT ?p ?o ?g WHERE { ${inGraphs(sel, `<${iri}> ?p ?o`)} } LIMIT ${LIMIT}`),
      select(endpoint, `SELECT DISTINCT ?s ?p ?g WHERE { ${inGraphs(sel, `?s ?p <${iri}>`)} } LIMIT ${LIMIT}`)
    ]);
    const outRows = merge(outgoing, ['p', 'o']);
    const inRows = merge(incoming, ['s', 'p']);
    out.innerHTML = `
      <h1>${esc(iri)}</h1>
      <div class="sub">${esc(endpoint)}</div>
      <div class="grid">
        ${box('Outgoing', outRows, outgoing.length >= LIMIT, r =>
          `<tr><td>${iriLink(r.p.value)}</td><td>${renderTerm(r.o)}${graphTag(r)}</td></tr>`)}
        ${box('Incoming', inRows, incoming.length >= LIMIT, r =>
          `<tr><td>${iriLink(r.s.value, r.s.value)}${graphTag(r)}</td><td>${iriLink(r.p.value)}</td></tr>`)}
      </div>`;
  } catch (e) {
    out.innerHTML = `<p class="err">Query failed: ${esc(e.message)}. Check the endpoint URL and its CORS headers.</p>`;
  }
}

/* ---------- events ---------- */
$('cfg').addEventListener('submit', e => {
  e.preventDefault();
  location.hash = linkTo($('iri').value.trim()).slice(1);
  load(); // in case the hash did not change
});
$('graphs-list').addEventListener('change', selectionChanged);
$('g-all').addEventListener('click', () => {
  document.querySelectorAll('#graphs-list input').forEach(i => i.checked = true);
  selectionChanged();
});
$('g-none').addEventListener('click', () => {
  document.querySelectorAll('#graphs-list input').forEach(i => i.checked = false);
  selectionChanged();
});
window.addEventListener('hashchange', () => { readHash(); load(); });
readHash();
load();
</script>
</body>
</html>
